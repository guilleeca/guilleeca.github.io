<g transform="translate(0,20)"><text xml:space="preserve" x="44" y="78" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8BA3C7">Soy Guillermo, estudiante de <tspan font-weight="700" fill="#E6EDF7">Ciencia de Datos e Ingeniería</tspan> en la <tspan font-weight="700" fill="#E6EDF7">UPM</tspan>. Me interesa todo</text><text xml:space="preserve" x="44" y="105" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8BA3C7">el ciclo de vida del dato: desde la ingesta y el procesamiento a escala hasta el</text><text xml:space="preserve" x="44" y="132" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8BA3C7">modelado y la puesta en producción.</text><text xml:space="preserve" x="44" y="186" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8BA3C7"><tspan fill="#38BDF8">▸ </tspan><tspan font-weight="700" fill="#E6EDF7">Pipelines de datos </tspan>batch y en tiempo real con arquitecturas Big Data</text><text xml:space="preserve" x="44" y="213" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8BA3C7"><tspan fill="#38BDF8">▸ </tspan><tspan font-weight="700" fill="#E6EDF7">Machine Learning y Deep Learning </tspan>aplicados a problemas reales</text><text xml:space="preserve" x="44" y="240" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8BA3C7"><tspan fill="#38BDF8">▸ </tspan><tspan font-weight="700" fill="#E6EDF7">Herramientas de analítica </tspan>pensadas para el usuario final</text><text xml:space="preserve" x="44" y="267" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8BA3C7"><tspan fill="#38BDF8">▸ </tspan><tspan font-weight="700" fill="#E6EDF7">Aprendiendo: </tspan>cloud, orquestación y MLOps</text></g></svg>