name: Actualizar estadísticas del perfil

on:
  schedule:
    - cron: "17 5 * * *"   # cada día a las ~06:17 (hora de Madrid)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar tarjetas
        run: python scripts/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/activity.svg
          git diff --cached --quiet || (git commit -m "Actualizar estadísticas" && git push)
